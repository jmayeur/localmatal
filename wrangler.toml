name = "localmatal"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ── Backup Worker (separate deployment) ─────────────────────────────────────
[env.backup]
name = "localmatal-backup"
main = "workers/backup.ts"

[env.backup.triggers]
crons = ["0 3 * * *"]

[[env.backup.d1_databases]]
binding = "DB"
database_name = "localmatal"
database_id = "f729b946-522a-4d12-b33e-661a86074a55"

[[env.backup.r2_buckets]]
binding = "MEDIA"
bucket_name = "localmatal-images"

[[d1_databases]]
binding = "DB"
database_name = "localmatal"
database_id = "f729b946-522a-4d12-b33e-661a86074a55"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "localmatal-images"

[[kv_namespaces]]
binding = "CURRENT_PLACE_CACHE"
id = "2de0bf0f7e904b7eb35110833e45871e"

[ai]
binding = "AI"

[vars]
SUBMISSIONS_PAUSED = "false"
OVERLAP_THRESHOLD = "0.65"
OVERLAP_LLM_THRESHOLD = "0.50"
DIGEST_THRESHOLD = "5"
IMAGES_BASE_URL = "https://images.localmatal.com"
CF_TEAM_DOMAIN = "jmayeur"

# ── Preview environment (isolated DB + bucket) ──────────────────────────────
[env.preview]
name = "localmatal-preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "localmatal-preview"
database_id = "f775ae78-4b36-4b54-98e8-3a19767f3b30"
migrations_dir = "migrations"

[[env.preview.r2_buckets]]
binding = "MEDIA"
bucket_name = "localmatal-images-preview"

[[env.preview.kv_namespaces]]
binding = "CURRENT_PLACE_CACHE"
id = "24c9a02c33dc4bcf8ec96aaccdfdc22e"

[env.preview.ai]
binding = "AI"

[env.preview.vars]
SUBMISSIONS_PAUSED = "false"
OVERLAP_THRESHOLD = "0.65"
OVERLAP_LLM_THRESHOLD = "0.50"
DIGEST_THRESHOLD = "5"
IMAGES_BASE_URL = ""
