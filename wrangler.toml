name = "localmatal"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "localmatal"
database_id = "PLACEHOLDER_REPLACE_WITH_REAL_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "localmatal-images"

[[kv_namespaces]]
binding = "CURRENT_PLACE_CACHE"
id = "PLACEHOLDER_REPLACE_WITH_REAL_ID"

[ai]
binding = "AI"

[vars]
SUBMISSIONS_PAUSED = "false"
OVERLAP_THRESHOLD = "0.65"
OVERLAP_LLM_THRESHOLD = "0.50"
DIGEST_THRESHOLD = "5"
IMAGES_BASE_URL = "https://images.localmatal.com"

# ── Preview environment (isolated DB + bucket) ──────────────────────────────
[env.preview]
name = "localmatal-preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "localmatal-preview"
database_id = "PLACEHOLDER_PREVIEW_DB_ID"
migrations_dir = "migrations"

[[env.preview.r2_buckets]]
binding = "MEDIA"
bucket_name = "localmatal-images-preview"

[[env.preview.kv_namespaces]]
binding = "CURRENT_PLACE_CACHE"
id = "PLACEHOLDER_PREVIEW_KV_ID"

[env.preview.ai]
binding = "AI"

[env.preview.vars]
SUBMISSIONS_PAUSED = "false"
OVERLAP_THRESHOLD = "0.65"
OVERLAP_LLM_THRESHOLD = "0.50"
DIGEST_THRESHOLD = "5"
IMAGES_BASE_URL = "https://images-preview.localmatal.com"
